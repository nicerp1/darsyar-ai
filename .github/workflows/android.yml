name: Build signed Android release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "css/**"
      - "data/**"
      - "fonts/**"
      - "icons/**"
      - "images/**"
      - "js/**"
      - "index.html"
      - "privacy.html"
      - "manifest.json"
      - "scripts/sync-mobile.mjs"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npm run android:sync
      - name: Set monotonic Android version
        run: |
          patch=$((GITHUB_RUN_NUMBER - 77))
          test "$patch" -ge 1
          code=$((10100 + patch))
          echo "DARSYAR_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "DARSYAR_VERSION_NAME=1.1.$patch" >> "$GITHUB_ENV"
      - name: Restore release signing key
        env:
          DARSYAR_KEYSTORE_BASE64: ${{ secrets.DARSYAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$DARSYAR_KEYSTORE_BASE64"
          echo "$DARSYAR_KEYSTORE_BASE64" | base64 --decode > android/app/darsyar-release.jks
      - name: Build signed release APK
        working-directory: android
        env:
          DARSYAR_KEYSTORE_PATH: darsyar-release.jks
          DARSYAR_KEYSTORE_PASSWORD: ${{ secrets.DARSYAR_KEYSTORE_PASSWORD }}
          DARSYAR_KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
          DARSYAR_KEY_PASSWORD: ${{ secrets.DARSYAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature and version
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "package: name='ir.darsyar.app' versionCode='${DARSYAR_VERSION_CODE}' versionName='${DARSYAR_VERSION_NAME}'"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk darsyar.apk
          tag="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" darsyar.apk --clobber
          else
            gh release create "$tag" darsyar.apk --target "$GITHUB_SHA" --title "روند Android ${DARSYAR_VERSION_NAME}" --notes "نسخهٔ امضاشدهٔ اندروید روند. شناسه: ir.darsyar.app؛ نسخه ساخت: ${DARSYAR_VERSION_CODE}. ورود با نام کاربری و رمز عبور. استفاده از روند فعلاً رایگان است."
          fi
