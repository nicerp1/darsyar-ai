name: Build signed Android release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "css/**"
      - "data/**"
      - "fonts/**"
      - "icons/**"
      - "images/**"
      - "js/**"
      - "index.html"
      - "privacy.html"
      - "manifest.json"
      - "scripts/sync-mobile.mjs"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npm run android:sync
      - name: Restore release signing key
        env:
          DARSYAR_KEYSTORE_BASE64: ${{ secrets.DARSYAR_KEYSTORE_BASE64 }}
        run: |
          test -n "$DARSYAR_KEYSTORE_BASE64"
          echo "$DARSYAR_KEYSTORE_BASE64" | base64 --decode > android/app/darsyar-release.jks
      - name: Build signed release APK
        working-directory: android
        env:
          DARSYAR_KEYSTORE_PATH: darsyar-release.jks
          DARSYAR_KEYSTORE_PASSWORD: ${{ secrets.DARSYAR_KEYSTORE_PASSWORD }}
          DARSYAR_KEY_ALIAS: ${{ secrets.DARSYAR_KEY_ALIAS }}
          DARSYAR_KEY_PASSWORD: ${{ secrets.DARSYAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-1.0.8-myket-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
